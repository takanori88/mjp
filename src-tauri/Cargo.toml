[package]
name = "mdq"
version = "0.1.0"
description = "Markdown Quick Look"
edition = "2021"
rust-version = "1.90"

[features]
perf = []

[lib]
name = "mdq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
notify = "8"
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
